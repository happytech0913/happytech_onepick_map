<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<!-- 게스트에게 전체 강의 제목이 보이는 페이지다. 검색에 색인되면 통제가 안 된다. -->
<meta name="robots" content="noindex, nofollow" />
<link rel="preconnect" href="https://script.google.com" />
<link rel="preconnect" href="https://script.googleusercontent.com" />
<link rel="preconnect" href="https://player.vimeo.com" />
<title>강의 아카이브 · 해피테크</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>" />
<style>
/* ─────────────────────────────────────────────────────────────
   강의 아카이브 (2단계 · 테스트 배포본)
   커뮤니티(growin.html)의 색·글꼴을 그대로 씁니다. 다른 페이지처럼 보이면 안 됩니다.
   React를 쓰지 않은 이유 — 이 페이지의 일은 '빠르게 열리는 것'입니다.
   unpkg에서 React 3개를 받는 데만 수백 ms가 드는데, 여기서 할 일은
   목록 그리기와 iframe 하나 띄우기뿐이라 남는 장사가 아닙니다.
   ───────────────────────────────────────────────────────────── */
:root{
  --mint:#35C9A8; --peri:#6F7BE0; --ink:#1C2333; --sub:#6B7486;
  --coral:#E15F50; --gold:#EFB63C; --bg:#F3F6F5; --card:#FFFFFF; --line:#E4E9E8;
  --grad:linear-gradient(120deg,#35C9A8 0%,#6F7BE0 100%);
  --gradSoft:linear-gradient(120deg,rgba(53,201,168,.12),rgba(111,123,224,.12));
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:var(--bg); color:var(--ink); min-height:100vh;
  font-family:'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
  font-variant-numeric:tabular-nums;
}
button{font-family:inherit;cursor:pointer}
input:focus,button:focus{outline:2px solid var(--mint);outline-offset:2px}
::selection{background:rgba(53,201,168,.25)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.wrap{max-width:720px;margin:0 auto;padding:0 16px 64px}

/* ── 상단 ── */
.top{position:sticky;top:0;z-index:20;background:rgba(243,246,245,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .in{max-width:720px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:10px}
.brand{font-weight:800;font-size:15.5px;letter-spacing:-.02em}
.brand span{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.wallet{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.pill{border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 10px;font-size:11.5px;color:var(--sub);font-weight:700;white-space:nowrap}
.pill.on{border-color:transparent;background:var(--gradSoft);color:var(--ink)}
.pill.gold{border-color:rgba(239,182,60,.45);background:rgba(239,182,60,.12);color:#8A6410}
.linkbtn{border:none;background:none;color:var(--sub);font-size:11.5px;font-weight:700;text-decoration:underline;padding:4px}

/* ── 지갑: 크레딧·이용권을 몇 편인지까지 보여준다 ── */
.purse{max-width:720px;margin:0 auto;padding:0 16px 12px;display:flex;gap:8px}
.w{flex:1;min-width:0;background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 14px}
.w .k{display:block;font-size:11px;font-weight:800;color:var(--sub);letter-spacing:.02em}
.w b{display:block;font-size:22px;letter-spacing:-.03em;line-height:1.2;margin-top:1px}
.w .s{display:block;font-size:11px;color:var(--sub);margin-top:2px;line-height:1.45}
.w.gold{border-color:rgba(239,182,60,.45);background:rgba(239,182,60,.09)}
.w.gold b{color:#8A6410}
.w.zero b{color:#B7C0BE}

/* ── 배너 ── */
.banner{margin:14px 0 4px;border-radius:14px;padding:14px 16px;border:1px solid rgba(225,95,80,.3);background:rgba(225,95,80,.07)}
.banner b{display:block;font-size:14px;margin-bottom:4px;letter-spacing:-.02em}
.banner p{font-size:12.5px;color:var(--sub);line-height:1.65}

/* ── 분류 칩 ── */
.chips{display:flex;gap:7px;overflow-x:auto;padding:16px 0 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font-size:12.5px;font-weight:700;color:var(--sub);white-space:nowrap;transition:.15s}
.chip[aria-pressed="true"]{border-color:transparent;background:var(--grad);color:#fff}

/* ── 강의 카드 ── */
/* ── 목록 구분선 ── */
.sec{display:flex;align-items:baseline;gap:8px;padding:18px 4px 9px;font-size:12.5px;font-weight:800;letter-spacing:-.01em;color:var(--ink)}
.sec:first-child{padding-top:4px}
.sec span{font-size:11.5px;font-weight:700;color:var(--sub)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;margin-bottom:10px;overflow:hidden}
.card.locked{background:#FBFCFC}
.head{display:flex;gap:12px;align-items:flex-start;padding:16px;width:100%;border:none;background:none;text-align:left;cursor:pointer}
.mark{width:28px;height:28px;border-radius:9px;flex:0 0 28px;display:grid;place-items:center;font-size:13px;background:var(--gradSoft)}
.card.locked .mark{background:#EFF2F1}
.meta{font-size:11px;color:var(--sub);font-weight:700;letter-spacing:.01em;margin-bottom:3px}
.title{font-size:14.5px;font-weight:800;letter-spacing:-.02em;line-height:1.45}
.card.locked .title{color:#4A5364}
.sum{font-size:12.5px;color:var(--sub);line-height:1.6;margin-top:5px}
.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.tag{font-size:10.5px;font-weight:800;border-radius:999px;padding:3px 8px;background:#EFF2F1;color:var(--sub)}
.tag.open{background:rgba(53,201,168,.14);color:#127A63}
.tag.time{background:rgba(239,182,60,.16);color:#8A6410}
.caret{margin-left:auto;color:#B7C0BE;font-size:12px;padding-top:2px;transition:transform .18s}
.card.on .caret{transform:rotate(180deg)}

.body{padding:0 16px 16px;border-top:1px solid var(--line);margin-top:-1px}
.body>*:first-child{margin-top:14px}

/* ── 기준일 안내 ── */
.basis{border-radius:11px;padding:10px 12px;font-size:12px;line-height:1.6;margin-bottom:12px}
.basis.soft{background:#F1F4F3;color:var(--sub)}
.basis.warn{background:rgba(239,182,60,.14);color:#7A5809;font-weight:700}

/* ── 플레이어 ── */
.stage{position:relative;border-radius:12px;overflow:hidden;background:#0E1218;aspect-ratio:16/9;margin-bottom:12px}
.stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.wm{position:absolute;top:10px;left:12px;z-index:3;pointer-events:none;user-select:none;white-space:nowrap;font-size:11px;font-weight:700;color:rgba(255,255,255,.42);text-shadow:0 1px 3px rgba(0,0,0,.5);letter-spacing:.02em}
.stage .load{position:absolute;inset:0;display:grid;place-items:center;color:#8A94A6;font-size:12.5px}

/* 가운데 로고 — 5분에 한 번, 1분만, 아주 흐리게.
   시야를 가리면 강의를 방해하니 opacity 를 낮게 두고 천천히 넘어가게 한다. */
.wmc{position:absolute;inset:0;z-index:2;display:grid;place-items:center;pointer-events:none;user-select:none;
     opacity:0;transition:opacity 1.6s ease}
.wmc.on{opacity:.14}
.wmc img{width:38%;max-width:220px;height:auto;filter:drop-shadow(0 2px 8px rgba(0,0,0,.35))}
.wmc span{font-size:clamp(22px,7vw,52px);font-weight:800;letter-spacing:-.03em;color:#fff;
          text-shadow:0 2px 10px rgba(0,0,0,.45)}

.text{font-size:13.5px;line-height:1.85;color:#2B3444;white-space:pre-wrap;word-break:break-word}
.text img{max-width:100%;border-radius:10px}

/* ── 버튼 ── */
.btn{border:none;border-radius:999px;padding:12px 20px;font-weight:800;font-size:13.5px;letter-spacing:-.01em;transition:.15s}
.btn.primary{background:var(--grad);color:#fff}
.btn.ghost{background:#fff;border:1.5px solid var(--line);color:var(--ink)}
.btn:disabled{background:#E9EDEC;color:#9AA5A3;cursor:not-allowed}
.btn.ghost:disabled{border-color:var(--line)}
.btn.block{width:100%}
.alt{display:block;width:100%;text-align:center;margin-top:10px;border:none;background:none;color:var(--sub);font-size:12px;font-weight:700;text-decoration:underline;padding:4px}
.why{font-size:12.5px;color:var(--sub);line-height:1.65;margin-bottom:12px}

/* ── 모달 ── */
.veil{position:fixed;inset:0;z-index:60;background:rgba(14,18,24,.5);display:grid;place-items:end center;padding:0}
.sheet{background:#fff;width:100%;max-width:440px;border-radius:20px 20px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom));animation:up .22s ease}
@keyframes up{from{transform:translateY(18px);opacity:0}to{transform:none;opacity:1}}
@media(min-width:520px){.veil{place-items:center}.sheet{border-radius:20px}}
.sheet h3{font-size:16px;letter-spacing:-.02em;margin-bottom:14px}
.recap{border:1px solid var(--line);border-radius:13px;padding:14px;margin-bottom:16px;background:#FAFBFB}
.recap .lec{font-size:13.5px;font-weight:800;letter-spacing:-.02em;line-height:1.45}
.recap .until{font-size:12.5px;color:var(--sub);margin-top:6px;line-height:1.6}
.row{display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px;padding-top:12px;margin-top:12px;border-top:1px dashed var(--line)}
.row .k{color:var(--sub);font-weight:700}
.row .v{font-weight:800}
.row .v s{color:#B7C0BE;font-weight:700;margin-right:6px}

/* ── 로그인 ── */
/* ── 로그인 ──
   로그인한 뒤 화면과 같은 언어를 쓴다. 상단 브랜드의 그라데이션 처리를 그대로 가져와
   "같은 곳에 들어왔다"는 느낌이 이어지게 했다.
   배경의 번진 빛 두 덩이가 유일한 장식이다 — 문 너머에서 새어나오는 빛.
   그 외에는 조용히 둔다. 이 화면의 일은 빨리 통과시키는 것이다. */
.gatebg{position:fixed;inset:0;overflow-y:auto;display:flex;align-items:center;justify-content:center;padding:28px 20px}
.gatebg:before,.gatebg:after{content:"";position:fixed;border-radius:50%;filter:blur(72px);pointer-events:none;z-index:0}
.gatebg:before{width:320px;height:320px;background:rgba(53,201,168,.38);top:-100px;left:-80px}
.gatebg:after{width:360px;height:360px;background:rgba(111,123,224,.30);bottom:-130px;right:-100px}
.gate{position:relative;z-index:1;width:100%;max-width:380px;background:#fff;border:1px solid var(--line);border-radius:24px;padding:30px 26px 24px;box-shadow:0 20px 50px -26px rgba(28,35,51,.30);animation:rise .32s ease both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.gate .logo{width:42px;height:42px;border-radius:13px;background:var(--grad);display:grid;place-items:center;font-size:19px;margin-bottom:15px}
.gate h1{font-size:21px;letter-spacing:-.03em;line-height:1.35;margin-bottom:7px;font-weight:800}
.gate h1 span{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.gate .lede{font-size:12.5px;color:var(--sub);line-height:1.75;margin-bottom:22px}
.field{margin-bottom:11px}
.field label{display:block;font-size:11.5px;font-weight:800;color:var(--sub);margin-bottom:6px}
.field input{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:13px 14px;font-size:15px;font-family:inherit;outline:none;background:#FAFBFB;color:var(--ink);transition:border-color .15s,background .15s}
.field input:focus{background:#fff;border-color:var(--mint)}
.err{font-size:12.5px;color:var(--coral);font-weight:700;line-height:1.6;margin:10px 0 0}

/* ── 관리자 편집기 ── */
.adminbar{display:flex;gap:8px;align-items:center;margin:16px 0 0}
.adminbar .btn{padding:10px 16px;font-size:13px}

/* ── 관리자 탭 · 멤버 패널 ── */
.atab{display:flex;gap:7px;padding:16px 0 4px}
.mpanel{padding-top:12px}
.mbox{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:12px}
.mbox h4{font-size:13.5px;letter-spacing:-.02em;margin-bottom:14px}
.mbox .f{margin-bottom:12px}
.mbox input,.mbox textarea{width:100%;border:1.5px solid var(--line);border-radius:11px;padding:11px 12px;font-size:14px;font-family:inherit;outline:none;background:#fff;color:var(--ink)}
.mbox textarea{min-height:130px;line-height:1.7;resize:vertical;font-variant-numeric:tabular-nums}
.mrow{display:flex;gap:8px;align-items:flex-start;margin-top:10px}
.mrow input{flex:1;min-width:0}
.mrow .btn{flex:0 0 auto;padding:11px 18px;font-size:13px}
.mhead{font-size:12.5px;font-weight:800;color:var(--sub);padding:2px 2px 10px}
.mtable{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fff}
.mtable table{width:100%;border-collapse:collapse;font-size:12.5px}
.mtable td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.5}
.mtable tr:last-child td{border-bottom:none}
.mtable td:first-child{white-space:nowrap;font-weight:800;color:var(--sub);width:1%}
.mtable td:nth-child(2){white-space:nowrap;font-weight:700}
.mtable td:nth-child(3){white-space:nowrap;color:var(--sub)}
.mtable .new td:first-child{color:#127A63}
.mtable .exist td:first-child{color:var(--peri)}
.mtable .skip td{color:#A8B2B0}
.mtable .warn td:first-child{color:#8A6410}
.mtable .warn td{background:rgba(239,182,60,.09)}
.wnote{display:inline-block;margin-top:3px;color:#8A6410;font-weight:700}
.mcard{border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:12px;background:#FAFBFB}
.mname{font-size:14px;font-weight:800;letter-spacing:-.02em}
.mname span{font-weight:700;font-size:11px;color:var(--sub);margin-left:7px}
.mmeta{font-size:12px;color:var(--sub);line-height:1.65;margin-top:5px}
.mdrop{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-top:6px}
.mdrop span{font-size:11.5px;color:var(--sub);line-height:1.55}
.mdrop .danger{padding:4px 0}
.edit{border:none;background:none;color:var(--peri);font-size:11.5px;font-weight:800;text-decoration:underline;padding:6px 8px;margin-left:auto;flex:0 0 auto}
.sheet.tall{max-height:88vh;overflow-y:auto}
.f{margin-bottom:12px}
.f label{display:block;font-size:11.5px;font-weight:800;color:var(--sub);margin-bottom:5px}
.f input,.f select,.f textarea{width:100%;border:1.5px solid var(--line);border-radius:11px;padding:11px 12px;font-size:14px;font-family:inherit;outline:none;background:#fff;color:var(--ink)}
.f textarea{min-height:150px;line-height:1.7;resize:vertical}
/* .hint 를 .f 안에서만 정의해두면 필드 밖에 놓인 안내가 본문 크기로 나온다.
   클래스 자체에 크기를 주고, .f 안에서만 위 여백을 더한다. */
.hint{font-size:11.5px;color:var(--sub);line-height:1.55}
.f .hint{margin-top:5px}
.hint.bad{color:var(--coral);font-weight:700}
.hint.good{color:#127A63;font-weight:700}
.two{display:flex;gap:10px}
.two>*{flex:1;min-width:0}
details.adv{border-top:1px solid var(--line);margin-top:16px;padding-top:14px}
details.adv summary{font-size:12.5px;font-weight:800;color:var(--sub);cursor:pointer;list-style:none;padding:2px 0}
details.adv summary::-webkit-details-marker{display:none}
details.adv summary:before{content:"▸ ";font-size:10px}
details.adv[open] summary:before{content:"▾ "}
details.adv>*:not(summary){margin-top:14px}
.checks{display:flex;flex-wrap:wrap;gap:7px}
.ck{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font-size:12.5px;font-weight:700;color:var(--sub)}
.ck[aria-pressed="true"]{border-color:transparent;background:var(--grad);color:#fff}
.ck:disabled{opacity:.4}
.danger{border:none;background:none;color:var(--coral);font-size:12px;font-weight:800;text-decoration:underline;padding:6px}
.empty{text-align:center;padding:56px 20px;color:var(--sub);font-size:13px;line-height:1.7}.skel{height:78px;border-radius:16px;background:linear-gradient(90deg,#EDF1F0,#F6F8F8,#EDF1F0);background-size:200% 100%;animation:sh 1.2s infinite;margin-bottom:10px}
@keyframes sh{to{background-position:-200% 0}}
.foot{text-align:center;padding:28px 0 0;font-size:11px;color:#A8B2B0;line-height:1.8}
.legal{display:block;margin-top:18px;font-size:10px;color:#C4CCCA;line-height:1.7}
/* 겉모습은 주변 글자와 똑같이 둔다. 커서만 손 모양이라 아는 사람만 안다. */
.doorbell{cursor:pointer}

/* ── 측정 기록 (관리자) ── */
.perf{margin-top:20px;border:1px solid var(--line);border-radius:14px;background:#fff;padding:12px 14px;text-align:left}
.ptitle{font-size:11px;font-weight:800;color:var(--sub);margin-bottom:8px}
.prow{display:flex;gap:10px;flex-wrap:wrap;font-size:11.5px;color:var(--sub);padding:4px 0;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.prow:first-of-type{border-top:none}
.prow b{color:var(--ink);min-width:78px}
.phint{font-size:10.5px;color:#A8B2B0;line-height:1.6;margin-top:9px;padding-top:8px;border-top:1px solid var(--line)}
.right{font-size:11.5px;color:var(--sub);line-height:1.6;margin-bottom:12px}

/* ── 게스트 안내 ── */
.invite{flex:1;background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 18px 16px}
.invite b{display:block;font-size:15px;letter-spacing:-.02em;margin-bottom:7px}
.invite p{font-size:12.5px;color:var(--sub);line-height:1.7;margin-bottom:14px}
.invite .btn{display:block;text-decoration:none;text-align:center}
.invite .alt{display:block;text-decoration:underline}

/* ── 로그인 화면 구분선 ── */
.gsep{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:20px;padding-top:16px;border-top:1px solid var(--line)}
.gsep span{font-size:12px;color:var(--sub)}
.gsep .linkbtn{font-size:12.5px;color:var(--peri)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:80;background:var(--ink);color:#fff;padding:12px 18px;border-radius:999px;font-size:12.5px;font-weight:700;max-width:90vw;text-align:center}
</style>
</head>
<body>
<div id="root"></div>

<script>
/* ═══════════════════════════════════════════════════════════════
   설정 — growin.html 과 같은 배포본을 바라봅니다
   ═══════════════════════════════════════════════════════════════ */
var API_URL = "https://script.google.com/macros/s/AKfycbz_TQCrc0dxcaKSS9LCCB84C22Kzt2qYgwRRMSJxYLzmAw3oHWZIdtDA9t8owkCch2s/exec";

/* 커뮤니티와 공유할 세션 키.
   3단계에서 growin.html 의 setSessToken 옆에 아래 한 줄만 넣으면 자동으로 이어집니다.
     try{localStorage.setItem("growin_sess_v1",JSON.stringify({t:Date.now(),token:d.token,name:name}))}catch(e){} */
var SESS_KEY = "growin_sess_v1";
var LEC_KEY  = "ht_lec_v1";     // 목록 캐시 — 재방문 때 즉시 그리고 뒤에서 갱신

/* ═══════════════════════════════════════════════════════════════
   통신 · 측정 (v65)

   총 걸린 시간과 서버가 쓴 시간을 같이 재둔다. 이 둘이면 원인이 갈린다.
     서버가 크다        → 시트 읽기
     총 − 서버가 크다   → Apps Script 302 리다이렉트 (줄일 수 없음. 호출 횟수만)
     둘 다 작은데 느리다 → 화면 그리기
   ═══════════════════════════════════════════════════════════════ */
var PERF = [];   // 최근 기록 (관리자 화면 하단에 보인다)

function perf(label, ms, srv, extra) {
  PERF.unshift({ t: Date.now(), label: label, ms: Math.round(ms), srv: srv == null ? null : Math.round(srv), extra: extra || "" });
  if (PERF.length > 12) PERF.pop();
  try {
    console.log("[" + label + "] 총 " + Math.round(ms) + "ms" +
      (srv == null ? "" : " · 서버 " + Math.round(srv) + "ms · 네트워크 " + Math.round(ms - srv) + "ms") +
      (extra ? " · " + extra : ""));
  } catch (e) {}
}

function api(action, payload) {
  var t0 = (performance && performance.now) ? performance.now() : Date.now();
  var body = JSON.stringify(Object.assign({ action: action }, payload || {}));
  return fetch(API_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: body,
  }).then(function (r) { return r.json(); }).then(function (j) {
    var t1 = (performance && performance.now) ? performance.now() : Date.now();
    var laps = j.data && j.data.laps;
    perf(action, t1 - t0, j.srv,
      laps ? laps.filter(function (l) { return l.ms >= 30; })
                 .map(function (l) { return l.k + " " + l.ms; }).join(" · ") : "");
    if (!j.ok) throw new Error(j.error || "요청에 실패했어요");
    return j.data;
  });
}

/* 콜드 스타트(2~4초) 선점 (v65)

   boot() 가 몇 ms 뒤에 진짜 요청을 보낸다. 둘이 동시에 나가니 깨울 시간이 없고,
   재방문 때마다 콜드 스타트를 그대로 맞았다. 예열이 아니라 낭비였다.

   이제 로그인 화면을 띄울 때만 쏜다 — 이름·비밀번호를 치는 몇 초가 예열 시간이 된다.
   토큰이 있으면 예열을 건너뛰고 곧장 lecList 로 간다. */
function warmup() {
  try { fetch(API_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: '{"action":"ping"}' }); } catch (e) {}
}

function lsGet(k) { try { return JSON.parse(localStorage.getItem(k) || "null"); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
function lsDel(k) { try { localStorage.removeItem(k); } catch (e) {} }

/* ═══════════════════════════════════════════════════════════════
   표시용 계산
   ═══════════════════════════════════════════════════════════════ */
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}

/* 남은 시간 — 분 단위까지만. 초까지 세는 건 사람을 쫓는 느낌이라 뺐다 */
function remain(ms) {
  var d = ms - now();
  if (d <= 0) return null;
  var h = Math.floor(d / 3600000), m = Math.floor((d % 3600000) / 60000);
  if (h >= 1) return h + "시간 " + m + "분 남음";
  if (m >= 1) return m + "분 남음";
  return "곧 만료";
}

function whenText(ms) {
  var d = new Date(ms);
  var wd = ["일", "월", "화", "수", "목", "금", "토"][d.getDay()];
  var h = d.getHours(), ap = h < 12 ? "오전" : "오후", hh = h % 12 || 12;
  return (d.getMonth() + 1) + "/" + d.getDate() + " " + wd + " " + ap + " " + hh + ":" + ("0" + d.getMinutes()).slice(-2);
}

/* basisDate 로부터 몇 달이 지났는지 — 자동 갱신은 하지 않고 경고만 띄운다 */
function basisNote(s) {
  var m = String(s || "").match(/^(\d{4})-(\d{2})/);
  if (!m) return null;
  var d = new Date(now());
  var months = (d.getFullYear() - Number(m[1])) * 12 + (d.getMonth() + 1 - Number(m[2]));
  if (months < BASIS_SOFT) return null;
  var when = m[1] + "년 " + Number(m[2]) + "월";
  if (months < BASIS_WARN) return { cls: "soft", text: when + " 기준으로 만든 강의예요." };
  return { cls: "warn", text: when + " 기준이에요 · " + months + "개월 지났으니 제도가 바뀌었을 수 있어요" };
}

/* ── 로그인 화면 ──
   "누구를 위한 곳"이 아니라 "무엇이 있는 곳"을 먼저 말한다.
   자격을 앞세우면 자격 없는 사람이 첫 줄에서 걸러진다 — 게스트도 같은 문으로 들어온다.

function renderGate(err, name) {
  warmup();   // 이 화면에 머무는 몇 초가 컨테이너를 깨우는 시간이 된다
  root.innerHTML =
    '<div class="gatebg"><div class="gate">' +
      '<div class="logo">🎬</div>' +
      '<h1>해피테크 <span>강의 아카이브</span></h1>' +
      '<p class="lede">부동산 경매 강의를 모아둔 곳이에요.<br>로그인하시면 수강할 수 있어요. 처음이시면 둘러보셔도 돼요.</p>' +
      '<div class="field"><label for="gn">이름</label><input id="gn" autocomplete="name" value="' + esc(name || "") + '" /></div>' +
      '<div class="field"><label for="gp">비밀번호 4자리</label><input id="gp" inputmode="numeric" maxlength="4" autocomplete="current-password" type="password" /></div>' +
      (err ? '<p class="err">' + err + "</p>" : "") +
      '<button class="btn primary block" id="gb" style="margin-top:16px">들어가기</button>' +
      '<div class="gsep"><span>처음 오셨나요?</span><button class="linkbtn" id="gguest">둘러보기</button></div>' +
    "</div></div>";

  var n = document.getElementById("gn"), p = document.getElementById("gp"), b = document.getElementById("gb");
  function go() {
    var nv = n.value.trim(), pv = p.value.trim();
    if (!nv || pv.length !== 4) { renderGate("이름과 비밀번호 4자리를 확인해주세요", nv); return; }
    b.disabled = true; b.textContent = "확인 중…";
    /* scope="archive" — 서버가 커뮤니티 로그인과 구분한다.
       커뮤니티는 member 자격이 있어야 로그인되지만, 아카이브는 수강생도 들어와야 한다. */
    api("login", { name: nv, p4: pv, scope: "archive" }).then(function (d) {
      ST.token = d.token; ST.name = nv; ST.guest = false;
      lsSet(SESS_KEY, { t: Date.now(), token: d.token, name: nv });
      /* v67: 서버가 목록까지 같이 보내준다. 여기서 load() 를 또 부르면
         Apps Script 왕복(1.3~2.0초)을 한 번 더 하는 셈이라 그대로 쓴다. */
      if (d.lec) {
        ST.data = d.lec;
        ST.offset = (d.lec.nowMs || Date.now()) - Date.now();
        lsSet(LEC_KEY, { t: Date.now(), d: d.lec });
        render();
      } else {
        load(true);
      }
    }).catch(function () {
      /* 실패 원인의 절반은 비밀번호가 아니라 이름 표기다.
         톡방 닉네임을 넣거나 띄어쓰기가 다른 경우. 그 한 줄이 문의를 줄인다. */
      renderGate("이름이나 비밀번호가 맞지 않아요.<br>가입하신 이름 그대로 넣으셨는지 확인해주세요.<br>계속 안 되면 해피테크나 운영진에게 말씀해주세요.", nv);
    });
  }
  b.onclick = go;
  p.onkeydown = function (e) { if (e.key === "Enter") go(); };
  document.getElementById("gguest").onclick = function () {
    ST.guest = true; ST.token = null;
    lsDel(LEC_KEY);           // 로그인 상태의 목록 캐시를 게스트가 물려받으면 안 된다
    load(true);
  };
  (n.value ? p : n).focus();
}

       "관리자"라고 적힌 버튼이 있으면 일반 멤버도 한 번은 눌러본다.
       저작권 문구 안의 '해피테크' 글자가 그 자리다 — 아무도 눌러볼 생각을 하지 않고,
       운영자는 어디인지 안다. 겉모습은 주변 글자와 완전히 같다. */
    '<span class="legal">© <span class="doorbell"' + (d.staff || d.guest ? "" : ' id="pinbtn"') + ">해피테크</span>" +
    ". 이 페이지의 강의 영상과 자료는 저작권법으로 보호받습니다.<br>" +
    "무단 복제·배포·공유·재판매는 법적 책임을 물을 수 있습니다.</span></p>" +
    (d.staff ? perfPanel() : "") + "</div>";

  root.innerHTML = html;
  perf("render", ((performance && performance.now) ? performance.now() : Date.now()) - _r0, null,
       "카드 " + (d.lectures || []).length + "개");

  document.getElementById("out").onclick = function () {
    lsDel(SESS_KEY); lsDel(LEC_KEY);
    try { sessionStorage.removeItem("ht_pin"); } catch (e) {}
    location.reload();   // 게스트든 멤버든 로그인 화면으로 돌아간다
  };
  var pb = document.getElementById("pinbtn");
  if (pb) pb.onclick = function () {
    /* 관리자 PIN 전용. 운영진 PIN 은 서버가 거절한다 —
       아카이브 강의는 운영자 개인 자산이라 운영진에게도 열지 않는다. */
    var v = prompt("관리자 PIN"); if (!v) return;
    var prev = ST.pin;
    ST.pin = v;
    load(false).then(function () {
      if (ST.data && ST.data.staff) {
        try { sessionStorage.setItem("ht_pin", v); } catch (e) {}
      } else { ST.pin = prev; }
    });
  };
  Array.prototype.forEach.call(document.querySelectorAll(".chips .chip"), function (b) {
    b.onclick = function () { ST.cat = b.dataset.cat; ST.openId = 0; render(); };
  });
  Array.prototype.forEach.call(document.querySelectorAll(".atab .chip"), function (b) {
    b.onclick = function () { ST.atab = b.dataset.atab; ST.openId = 0; render(); };
  });
  Array.prototype.forEach.call(document.querySelectorAll(".head"), function (b) {
    b.onclick = function () { toggle(Number(b.dataset.id)); };
    /* button 이 아니게 됐으니 키보드 조작을 직접 붙여준다 */
    b.onkeydown = function (e) {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(Number(b.dataset.id)); }
    };
  });
  Array.prototype.forEach.call(document.querySelectorAll("[data-use]"), function (b) {
    b.onclick = function (e) { e.stopPropagation(); askUse(Number(b.dataset.use), b.dataset.pay); };
  });

  var nb = document.getElementById("new");
  if (nb) nb.onclick = function () { openEditor(null); };
  bindMember();
  Array.prototype.forEach.call(document.querySelectorAll("[data-edit]"), function (b) {
    b.onclick = function (e) {
      e.stopPropagation();
      openEditor(ST.data.lectures.filter(function (x) { return x.id === Number(b.dataset.edit); })[0]);
    };
  });

  if (ST.pending) renderSheet();

  /* v74: 펼쳐져 있던 카드를 자리표시로 두지 않는다.

     맨 마지막에 둔다. 예전엔 root.innerHTML 바로 뒤에 있었는데, 여기서 한 번 걸리면
     아래의 핸들러 연결이 통째로 건너뛰어져 화면이 먹통이 됐다.
     복원에 실패하면 서버에 다시 물어서라도 "영상을 여는 중…"에 멈추지 않게 한다. */
  try { restoreOpen(); } catch (e) { try { console.error(e); } catch (e2) {} }
}

function restoreOpen() {
  if (!ST.openId || !ST.data) return;
  var l = ST.data.lectures.filter(function (x) { return x.id === ST.openId; })[0];
  if (!l || !l.open) return;
  var box = document.getElementById("body-" + ST.openId);
  if (!box || !box.querySelector(".stage .load")) return;   // 이미 칠해져 있으면 둔다
  if (ST.opened && ST.opened.id === ST.openId) {
    try { paint(ST.openId, ST.opened.v); return; } catch (e) { ST.opened = null; }
  }
  play(ST.openId);
}

/* 지갑 — 가진 것과 그게 무엇으로 바뀌는지를 나란히 놓는다.
   설명은 전부 설정 시트 값(lecCost · lecHours)에서 나온다.
   교환 가격이나 열람 시간을 바꾸면 이 문구도 따라 바뀐다 — 화면에 숫자를 박지 않는다. */
function purse(d, me) {
  if (d.staff) return "";

  /* 게스트에겐 지갑 대신 문 하나. (v59)
     "다 볼 수 있다"고 쓰지 않는다 — 그로인에 가입해도 access=member 몇 편만 열리고
     나머지는 크레딧을 모아야 한다. 가입 후 여전히 잠겨 있으면 속았다고 느낀다.
     v60: 실시간 특강을 첫 줄에 세웠다. 이 줄이 없으면 게스트가
     "그로인 = 이 강의 모음"으로 오해한다. 실제로는 특강이 본체고 여기가 부가 혜택이다. */
  if (d.guest) {
    var locked = (d.lectures || []).filter(function (l) { return !l.open; }).length;
    return '<div class="purse"><div class="invite">' +
      (locked ? "<b>지금 " + locked + "편이 잠겨 있어요</b>" : "<b>그로인 강의 아카이브</b>") +
      "<p>그로인은 2주에 한 번 실시간 특강이 열리는 커뮤니티예요.<br>" +
      "멤버가 되면 여기 강의도 크레딧으로 한 편씩 열어볼 수 있고,<br>" +
      "크레딧은 오전 프로그램·임장에 참여하면 쌓여요.</p>" +
      '<a class="btn primary block" href="' + LINK_GROWIN + '" target="_blank" rel="noopener">그로인 알아보기</a>' +
      (LINK_LOUNGE ? '<a class="alt" href="' + LINK_LOUNGE + '" target="_blank" rel="noopener">경매 라운지에서 먼저 둘러보기</a>' : "") +
      "</div></div>";
  }

  var cost = d.cost || 100;
  var hours = d.hours || 24;
  var t = me.tickets || 0;

  /* 이용권이 아카이브의 통화다 (v62)
     크레딧은 그로인 안에서만 뜻이 통하는 화폐이고, 여기서는 이용권으로 바꾸는 경로일 뿐이다.
     그래서 이용권을 앞에 두고, 크레딧은 그로인 멤버에게만 보여준다 —
     수강생·만료자는 벌 방법이 없는 화폐를 0으로 보게 되고, 그건
     "나는 뭔가 부족한 사람"처럼 읽힌다. */
  var ticket =
    '<div class="w' + (t ? " gold" : " zero") + '"><span class="k">이용권</span>' +
      "<b>" + t + "장</b>" +
      '<span class="s">1장당 1편 수강(' + hours + "시간)</span></div>";

  if (!me.membership) return '<div class="purse">' + ticket + "</div>";

  var credit =
    '<div class="w' + (me.credits >= cost ? "" : " zero") + '"><span class="k">크레딧</span>' +
      "<b>" + (me.credits || 0).toLocaleString() + "</b>" +
      '<span class="s">' + cost.toLocaleString() + " → 이용권 1장</span></div>";

  return '<div class="purse">' + ticket + credit + "</div>";
}

/* 관리자에게만 보이는 측정 기록.
   폰에서는 콘솔을 열 수 없으니 화면 하단에 둔다. */
function perfPanel() {
  if (!PERF.length) return "";
  var rows = PERF.map(function (p) {
    var net = p.srv == null ? null : p.ms - p.srv;
    return '<div class="prow"><b>' + esc(p.label) + "</b>" +
      "<span>총 " + p.ms + "ms</span>" +
      (p.srv == null ? "" : "<span>서버 " + p.srv + "</span><span>망 " + net + "</span>") +
      (p.extra ? "<span>" + esc(p.extra) + "</span>" : "") + "</div>";
  }).join("");
  return '<div class="perf"><div class="ptitle">최근 측정 · 관리자만 보여요</div>' + rows +
    '<div class="phint">서버가 크면 시트 읽기 · 망이 크면 Apps Script 리다이렉트 · 둘 다 작은데 느리면 화면 그리기</div></div>';
}

function sec(label, n) {
  return '<div class="sec">' + esc(label) + "<span>" + n + "편</span></div>";
}

function card(l) {  var open = ST.openId === l.id;
  var d = ST.data, me = d.me || {};
  var left = l.byPass && l.passExpiresMs ? remain(l.passExpiresMs) : null;

  var tags = "";
  if (l.open && l.byGroup) tags += '<span class="tag open">멤버십 포함</span>';
  if (l.open && l.byPass) tags += '<span class="tag time">' + esc(left || "곧 만료") + "</span>";
  if (!l.hasVideo) tags += '<span class="tag">영상 준비 중</span>';
  if (d.staff && l.access) tags += '<span class="tag">' + esc(l.access) + "</span>";
  if (d.staff && l.hide) tags += '<span class="tag">숨김</span>';

  var h =
    '<div class="card' + (l.open ? "" : " locked") + (open ? " on" : "") + '">' +
      '<div class="head" role="button" tabindex="0" data-id="' + l.id + '" aria-expanded="' + open + '">' +
        '<span class="mark">' + (l.open ? "▶" : "🔒") + "</span>" +
        "<span style=\"flex:1;min-width:0\">" +
          '<span class="meta">' + esc(l.catLabel || l.cat) + (l.date ? " · " + esc(l.date) : "") + "</span>" +
          '<span class="title" style="display:block">' + esc(l.title) + "</span>" +
          (l.summary ? '<span class="sum" style="display:block">' + esc(l.summary) + "</span>" : "") +
          (tags ? '<span class="tags">' + tags + "</span>" : "") +
        "</span>" +
        (d.staff ? '<button class="edit" data-edit="' + l.id + '">수정</button>' : "") +
        '<span class="caret">▼</span>' +
      "</div>";

  if (open) h += '<div class="body" id="body-' + l.id + '">' + (l.open ? '<div class="stage"><div class="load">영상을 여는 중…</div></div>' : lockedBody(l, me, d)) + "</div>";
  return h + "</div>";
}

/* 잠긴 강의를 펼쳤을 때 — 요약까지만. 본문·영상은 서버가 애초에 보내지 않는다.
   v56: 순서를 바꿨다. 이용권은 이미 받은 것(소유)이라 자격이 끊겨도 쓸 수 있고,
   크레딧은 그로인 화폐(자격)라 멤버십이 살아 있어야 쓴다. 서버 판정과 같은 순서다. */
function lockedBody(l, me, d) {
  if (!l.hasVideo) return '<p class="why">아직 영상이 올라오지 않은 강의예요.</p>';
  var cost = d.cost, hours = d.hours;

  /* v59: 게스트는 상단 안내 블록이 이미 설명했다. 카드마다 반복하면 세 번째부터 안 읽힌다. */
  if (d.guest) return '<p class="why">그로인 멤버가 크레딧으로 여는 강의예요.</p>';

  if (me.tickets > 0) {
    return '<p class="why">이용권 1장으로 ' + hours + "시간 동안 볼 수 있어요. 지금 " + me.tickets + "장 있어요.</p>" +
      '<button class="btn primary block" data-use="' + l.id + '" data-pay="ticket">이용권 1장으로 열기</button>' +
      (me.membership && me.credits >= cost
        ? '<button class="alt" data-use="' + l.id + '" data-pay="credit">크레딧 ' + cost + "으로 대신 쓰기</button>"
        : "");
  }

  if (me.membership) {
    if (me.credits >= cost) {
      return '<p class="why">크레딧 ' + cost + "으로 " + hours + "시간 동안 볼 수 있어요. 지금 " + me.credits.toLocaleString() + " 있어요.</p>" +
        '<button class="btn primary block" data-use="' + l.id + '" data-pay="credit">크레딧 ' + cost + "으로 열기</button>";
    }
    return '<p class="why">크레딧이 ' + cost + " 필요해요. 지금 " + me.credits.toLocaleString() + " 있어요 (" +
      (cost - me.credits).toLocaleString() + " 모자라요).<br>오전 프로그램·임장에 참여하시면 모을 수 있어요.</p>" +
      '<button class="btn primary block" disabled>크레딧 ' + cost + " 필요</button>";
  }

  /* 이용권도 없고 크레딧도 못 쓰는 사람 — 만료자와 수강생은 다음에 할 말이 다르다 */
  if (me.entitled === false) {
    return '<p class="why">멤버십이 만료돼서 잠겨 있어요. 연장하시면 바로 열립니다.</p>';
  }
  return '<p class="why">이 강의는 이용권으로 열 수 있어요. 지금 가진 이용권이 없어요.</p>';
}

/* ═══════════════════════════════════════════════════════════════
   펼치기 · 재생
   ═══════════════════════════════════════════════════════════════ */
function toggle(id) {
  if (ST.openId === id) { ST.openId = 0; ST.opened = null; render(); return; }
  ST.openId = id;
  render();   // render 끝에서 restoreOpen 이 받아둔 영상을 쓰거나 서버에 다시 묻는다
}

function play(id) {
  var box = document.getElementById("body-" + id);
  if (!box) return;
  api("lecOpen", { token: ST.guest ? undefined : (ST.token || undefined), adminKey: ST.pin || undefined, lecId: id, gid: ST.guest ? gid_() : undefined })
    .then(function (v) { paint(id, v); })
    .catch(function (e) {
      var b = document.getElementById("body-" + id);
      if (b) b.innerHTML = '<p class="why">' + esc(e.message) + "</p>";
      /* 서버가 거절했다면 목록이 실제와 어긋난 것 — 조용히 다시 맞춘다 */
      load(false);
    });
}

function paint(id, v) {
  ST.opened = { id: id, v: v };   // v71: 다시 그려져도 되살릴 수 있게 들고 있는다
  var box = document.getElementById("body-" + id);
  if (!box) return;
  var note = basisNote(v.basisDate);
  var frame = v.vimeo
    ? '<iframe src="https://player.vimeo.com/video/' + encodeURIComponent(v.vimeo.id) +
        (v.vimeo.h ? "?h=" + encodeURIComponent(v.vimeo.h) + "&" : "?") +
        'badge=0&byline=0&portrait=0&title=0&dnt=1" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe>'
    : (v.yt || '<div class="load">영상이 등록되지 않았어요</div>');

  box.innerHTML =
    (note ? '<div class="basis ' + note.cls + '">' + esc(note.text) + "</div>" : "") +
    '<div class="stage">' + frame +
      '<span class="wm" id="wm-' + id + '">' + esc(v.mark) + "</span>" +
      '<div class="wmc" id="wmc-' + id + '">' +
        (LOGO_URL ? '<img src="' + LOGO_URL + '" alt="" />' : "<span>해피테크</span>") +
      "</div>" +
    "</div>" +
    /* 남은 시간은 카드 위 태그가 1분마다 다시 계산한다.
       여기서 또 보여주면 그릴 때 고정된 값이라 시간이 지날수록 위아래가 어긋난다.
       대신 만료 "시각"은 남긴다 — 위에 없는 정보이고 "몇 시까지"가 계획에 쓸모 있다. */
    (v.expiresAt ? '<p class="why">' + whenText(v.expiresAt) + "까지 볼 수 있어요</p>" : "") +
    /* 첫 화면에 법률투가 있으면 그게 브랜드 인상이 된다. 여기는 부드럽게, 하단은 정식으로. */
    '<p class="right">이 영상의 저작권은 해피테크에 있어요. 개인 시청용으로만 이용해주세요.</p>' +
    (v.body ? '<div class="text">' + v.body + "</div>" : "");

  logoCycle(document.getElementById("wmc-" + id));
}

/* 가운데 로고를 주기적으로 스르륵 띄운다.
   화면에서 사라지면 스스로 멈춘다 — 카드를 접거나 다시 그려도 타이머가 쌓이지 않는다. */
function logoCycle(el) {
  if (!el) return;
  function show() {
    if (!document.body.contains(el)) return;   // 사라졌으면 여기서 끝
    el.classList.add("on");
    setTimeout(function () {
      if (!document.body.contains(el)) return;
      el.classList.remove("on");
      setTimeout(show, (LOGO_EVERY - LOGO_HOLD) * 1000);
    }, LOGO_HOLD * 1000);
  }
  setTimeout(show, (LOGO_EVERY - LOGO_HOLD) * 1000);   // 처음엔 한 주기 쉬었다 시작
}

/* 워터마크는 좌상단에 고정한다 (v55).
   30초마다 자리를 옮기던 걸 없앴다 — 움직이면 시선을 뺏어 강의에 집중이 안 된다.
   도용을 막자고 본래 기능인 '강의 수강'을 약화시키는 건 손해다.
   어차피 화면 녹화는 못 막고, 이건 계정 공유를 머뭇거리게 하는 장치다. */

/* ═══════════════════════════════════════════════════════════════
   교환 확인 — 숫자가 눈에 보여야 한다
   ═══════════════════════════════════════════════════════════════ */
function askUse(id, pay) {
  var l = ST.data.lectures.filter(function (x) { return x.id === id; })[0];
  if (!l) return;
  ST.pending = { l: l, pay: pay };
  renderSheet();
}

function renderSheet() {
  var p = ST.pending; if (!p) return;
  var d = ST.data, me = d.me, ticket = p.pay === "ticket";
  var until = now() + d.hours * 3600000;

  var old = document.querySelector(".veil"); if (old) old.remove();
  var v = document.createElement("div");
  v.className = "veil";
  v.innerHTML =
    '<div class="sheet" role="dialog" aria-modal="true">' +
      "<h3>" + (ticket ? "이용권 1장을 사용합니다" : "크레딧 " + d.cost + "을 사용합니다") + "</h3>" +
      '<div class="recap">' +
        '<div class="lec">' + esc(p.l.title) + "</div>" +
        '<div class="until">지금부터 ' + d.hours + "시간 · " + whenText(until) + "까지</div>" +
        '<div class="row"><span class="k">' + (ticket ? "이용권" : "크레딧") + '</span><span class="v">' +
          "<s>" + (ticket ? me.tickets + "장" : me.credits.toLocaleString()) + "</s>" +
          (ticket ? (me.tickets - 1) + "장" : (me.credits - d.cost).toLocaleString()) +
        "</span></div>" +
      "</div>" +
      '<button class="btn primary block" id="ok">사용하고 재생</button>' +
      '<button class="alt" id="no">취소</button>' +
      (ticket && me.credits >= d.cost ? '<button class="alt" id="swap">크레딧 ' + d.cost + "으로 대신 쓰기</button>" :
       (!ticket && me.tickets > 0 ? '<button class="alt" id="swap">이용권 1장으로 대신 쓰기</button>' : "")) +
    "</div>";
  document.body.appendChild(v);

  v.onclick = function (e) { if (e.target === v) close(); };
  document.getElementById("no").onclick = close;
  var sw = document.getElementById("swap");
  if (sw) sw.onclick = function () { p.pay = ticket ? "credit" : "ticket"; renderSheet(); };
  document.getElementById("ok").onclick = confirmUse;

  function close() { ST.pending = null; v.remove(); }
}

function confirmUse() {
  var p = ST.pending; if (!p || ST.busy) return;
  ST.busy = true;
  var btn = document.getElementById("ok");
  btn.disabled = true; btn.textContent = "여는 중…";

  api("lecUse", { token: ST.token, lecId: p.l.id, pay: p.pay })
    .then(function (v) {
      /* 서버가 알려준 잔액을 그대로 반영한다 — 화면에서 빼서 계산하지 않는다 */
      if (v.me) { ST.data.me.credits = v.me.credits; ST.data.me.tickets = v.me.tickets; }
      ST.data.lectures.forEach(function (x) {
        if (x.id === p.l.id) { x.open = true; x.byPass = true; x.passExpiresMs = v.expiresAt; }
      });
      ST.pending = null; ST.openId = p.l.id;
      var veil = document.querySelector(".veil"); if (veil) veil.remove();
      ST.busy = false;
      render();
      paint(p.l.id, v);
      lsSet(LEC_KEY, { t: Date.now(), d: ST.data });
      toast(v.spent && v.spent.source === "ticket" ? "이용권 1장을 썼어요" : "크레딧 " + (v.spent ? v.spent.cost : ST.data.cost) + "을 썼어요");
    })
    .catch(function (e) {
      ST.busy = false;
      btn.disabled = false; btn.textContent = "사용하고 재생";
      toast(e.message);
      load(false); // 잔액·권한이 어긋났을 수 있다
    });
}

/* ═══════════════════════════════════════════════════════════════
   멤버 탭 (관리자) — 등록 · 찾기 · 일괄 지급
   시트를 열지 않고 명단을 붙여넣어 한 번에 등록한다.
   쓰기 전에 무엇이 벌어질지 먼저 보여준다. 되돌릴 수 없는 일이라서.
   ═══════════════════════════════════════════════════════════════ */
function memberPanel() {
  var M = ST.mem;
  var groups = (ST.data.groupsKnown || []).slice();

  /* ── 확인 단계 ── */
  if (M.plan) {
    var c = M.plan.counts;
    var rowsHtml = M.plan.plan.map(function (p) {
      var tag = p.kind === "new" ? (p.warn ? "⚠ 동명이인" : "새로")
              : p.kind === "exist" ? "이미 있음" : "건너뜀";
      var detail = p.kind === "exist"
          ? esc(p.note) + (M.plan.tickets ? " · 이용권 " + p.have + "장 → " + p.will + "장" : "")
          : p.kind === "new"
          ? esc(p.groups || "(자격 없음)") + (M.plan.tickets ? " · 이용권 " + M.plan.tickets + "장" : "") +
            (p.warn ? '<br><span class="wnote">' + esc(p.note) + "</span>" : "")
          : esc(p.note);
      return '<tr class="' + p.kind + (p.warn ? " warn" : "") + '">' +
        "<td>" + tag + "</td><td>" + esc(p.name) + "</td><td>" + esc(p.p4) + "</td><td>" + detail + "</td></tr>";
    }).join("");

    return '<div class="mpanel">' +
      '<div class="mhead">' + c.total + "줄 읽음 · 새로 " + c.neo + " · 이미 있음 " + c.exist + " · 건너뜀 " + c.skip + "</div>" +
      '<div class="mtable"><table>' + rowsHtml + "</table></div>" +
      '<div class="mrow">' +
        '<button class="btn ghost" id="m-back">뒤로</button>' +
        '<button class="btn primary" id="m-commit"' + (c.neo + c.exist ? "" : " disabled") + ">" +
          (c.neo + c.exist) + "명 등록하기</button>" +
      "</div></div>";
  }

  /* ── 기본 화면 ── */
  var g = M.groups || [];
  var found = M.found;

  return '<div class="mpanel">' +

    /* ① 명단 등록 */
    '<div class="mbox"><h4>명단 등록</h4>' +
      '<div class="two">' +
        '<div class="f"><label for="m-g">그룹</label>' +
          '<input id="m-g" list="m-glist" placeholder="특강3기" value="' + esc(M.group || "") + '" />' +
          "<datalist id=\"m-glist\">" + groups.map(function (x) { return '<option value="' + esc(x) + '">'; }).join("") + "</datalist>" +
          '<p class="hint">이 명단 전원에게 붙습니다.</p></div>' +
        '<div class="f"><label for="m-u">만료일</label>' +
          '<input id="m-u" placeholder="2026-09-17" value="' + esc(M.until || "") + '" />' +
          '<p class="hint">비우면 무기한. 기수 전원이 같이 만료돼요.</p></div>' +
      "</div>" +
      '<div class="f" style="max-width:150px"><label for="m-t">이용권</label>' +
        '<input id="m-t" inputmode="numeric" value="' + esc(M.tickets ? M.tickets : "") + '" placeholder="0" />' +
        '<p class="hint">등록과 함께 지급</p></div>' +
      '<div class="f"><label for="m-list">명단 · 한 줄에 한 명</label>' +
        '<textarea id="m-list" placeholder="김민수 1234&#10;이서연 5678&#10;박준호 9012  특강3기,member@2026-11-30   ← 이 줄만 자격 둘">' + esc(M.text || "") + "</textarea>" +
        '<p class="hint">한 줄에 <b>이름 · 뒷 4자리</b> 두 개만 적으면 됩니다. 위에 적은 그룹이 전원에게 붙어요.<br>' +
        '어떤 사람만 다른 자격을 주려면 뒷자리 뒤에 그룹을 덧붙이세요 — 그 줄만 그게 쓰입니다.<br>' +
        '뒷자리는 앞의 0까지 그대로. 4자리가 아니면 그 줄은 건너뜁니다.</p></div>' +
      '<button class="btn primary block" id="m-check">확인하기</button>' +
      '<p class="hint" style="text-align:center;margin-top:8px">확인 단계에서는 아무것도 저장되지 않아요.</p>' +
    "</div>" +

    /* ② 한 명 찾기 */
    '<div class="mbox"><h4>한 명 찾기</h4>' +
      '<div class="mrow">' +
        '<input id="m-q" placeholder="이름 또는 뒷 4자리" value="' + esc(M.q || "") + '" />' +
        '<button class="btn ghost" id="m-find">찾기</button>' +
      "</div>" +
      (found ? (found.length ? found.map(memberCard).join("") : '<p class="hint" style="margin-top:12px">찾지 못했어요.</p>') : "") +
    "</div>" +

    /* ③ 일괄 지급 */
    '<div class="mbox"><h4>일괄 지급</h4>' +
      (g.length
        ? '<div class="checks" id="m-bg">' + g.map(function (x) {
            return '<button class="ck" data-g="' + esc(x.key) + '" aria-pressed="' + (M.bulk === x.key) + '">' + esc(x.key) + " " + x.n + "명</button>";
          }).join("") + "</div>"
        : '<p class="hint">대상을 불러오는 중…</p>') +
      '<div class="two" style="margin-top:12px">' +
        '<div class="f"><label for="m-bn">이용권</label><input id="m-bn" inputmode="numeric" placeholder="3" value="' + esc(M.bulkN ? M.bulkN : "") + '" /></div>' +
        '<div class="f"><label for="m-br">사유</label><input id="m-br" placeholder="2026 4분기 연장 혜택" value="' + esc(M.bulkR || "") + '" /></div>' +
      "</div>" +
      (M.bulk && M.bulkN > 0
        ? '<button class="btn primary block" id="m-bulk">' + bulkLabel(g, M.bulk, M.bulkN) + "</button>"
        : '<button class="btn primary block" disabled>' +
            (!M.bulk && !(M.bulkN > 0) ? "위에서 대상을 고르고 장수를 넣어주세요"
             : !M.bulk ? "위에서 대상 그룹을 눌러주세요"
             : "장수를 넣어주세요") + "</button>") +
    "</div>" +

  "</div>";
}

/* 62명 × 3장 = 186장. 잘못 누르면 60명 지갑이 한꺼번에 틀어진다 — 총량을 보여준다 */
function bulkLabel(g, key, n) {
  var t = g.filter(function (x) { return x.key === key; })[0];
  if (!t) return "지급하기";
  return t.n + "명에게 " + n + "장씩 · 총 " + (t.n * n) + "장";
}

function memberCard(m) {
  return '<div class="mcard">' +
    '<div class="mname">' + esc(m.name) + " " + esc(m.p4) + '<span>id ' + m.id + (m.joined ? " · " + esc(m.joined) + " 가입" : "") + "</span></div>" +
    '<div class="mmeta">자격 ' + (m.live.length ? esc(m.live.join(" · ")) : "없음") +
      "<br>이용권 " + m.tickets + "장 · 크레딧 " + (m.credits || 0).toLocaleString() + "</div>" +
    '<div class="mrow">' +
      '<input class="mg-n" data-id="' + m.id + '" inputmode="numeric" placeholder="장수" style="max-width:90px" />' +
      '<input class="mg-r" data-id="' + m.id + '" placeholder="사유" />' +
      '<button class="btn ghost mg-go" data-id="' + m.id + '">지급</button>' +
    "</div>" +
    (m.live.indexOf("member") >= 0
      ? '<div class="mdrop"><button class="danger mg-drop" data-id="' + m.id + '">멤버십만 빼기</button>' +
        "<span>커뮤니티·원픽 지도가 닫혀요. 크레딧·인증글·랭킹은 남아요.</span></div>"
      : "") +
  "</div>";
}

/* ═══════════════════════════════════════════════════════════════
   관리자 편집기 — 시트를 열지 않고 올리고 고친다
   기본 칸은 넷(제목·분류·영상·요약)뿐이고, 나머지는 접어둔다.
   ═══════════════════════════════════════════════════════════════ */
var ED = null; // 편집 중인 강의 · f 는 화면에 입력된 값 그대로

function openEditor(l) {
  ED = {
    id: l ? l.id : 0,
    f: {
      title: l ? l.title : "",
      cat: l ? l.cat : "",
      date: l ? l.date : "",
      vimeo: l ? (l.vimeoRaw || "") : "",
      summary: l ? (l.summary || "") : "",
      body: l ? (l.body || "") : "",
      basisDate: l ? (l.basisDate || "") : "",
    },
    access: l && l.access ? String(l.access).split(",").map(function (s) { return s.trim(); }).filter(String) : [],
    hide: !!(l && l.hide),
    pin: !!(l && l.pin),
    srcCat: l ? l.cat : "",
  };
  renderEditor();
}

/* 다시 그리기 전에 지금 입력된 값을 붙잡아 둔다 — 안 그러면 체크 하나 누를 때 본문이 날아간다 */
function grabEditor() {
  if (!ED) return;
  ["title", "cat", "date", "vimeo", "summary", "body", "basisDate"].forEach(function (k) {
    var el = document.getElementById("e-" + (k === "basisDate" ? "basis" : k === "summary" ? "sum" : k));
    if (el) ED.f[k] = el.value;
  });
}

function renderEditor() {
  var d = ST.data, f = ED.f;
  var cats = (d.cats || []).map(function (c) { return c.key; });
  [ED.srcCat, f.cat].forEach(function (c) { if (c && cats.indexOf(c) < 0) cats.push(c); });
  var groups = (d.groupsKnown || []).slice();
  var isAll = ED.access.indexOf("all") >= 0;

  var old = document.querySelector(".veil"); if (old) old.remove();
  var v = document.createElement("div");
  v.className = "veil";
  v.innerHTML =
    '<div class="sheet tall" role="dialog" aria-modal="true">' +
      "<h3>" + (ED.id ? "강의 수정" : "새 강의") + "</h3>" +

      '<div class="f"><label for="e-title">제목</label>' +
        '<input id="e-title" value="' + esc(f.title) + '" placeholder="주제만 짧게" />' +
        '<p class="hint">부가 설명은 아래 한 줄 요약으로 옮기면 목록이 훨씬 읽기 좋아요.</p></div>' +

      '<div class="two">' +
        '<div class="f"><label for="e-cat">분류</label><select id="e-cat">' +
          cats.map(function (c) { return '<option value="' + esc(c) + '"' + (f.cat === c ? " selected" : "") + ">" + esc(c) + "</option>"; }).join("") +
          '<option value="__new">+ 직접 입력</option></select></div>' +
        '<div class="f"><label for="e-date">날짜</label><input id="e-date" value="' + esc(f.date) + '" placeholder="2026-08-27" /></div>' +
      "</div>" +

      '<div class="f"><label for="e-vimeo">비메오 주소</label>' +
        '<input id="e-vimeo" value="' + esc(f.vimeo) + '" placeholder="https://vimeo.com/123456789/abcdef" />' +
        '<p class="hint" id="e-vh">주소를 어떤 형태로 붙여넣어도 알아서 읽어요.</p></div>' +

      '<div class="f"><label for="e-sum">한 줄 요약</label>' +
        '<input id="e-sum" value="' + esc(f.summary) + '" placeholder="이 강의에서 무엇을 알게 되는지" />' +
        '<p class="hint">잠긴 강의에서도 보이는 유일한 설명이에요.</p></div>' +

      '<div class="f"><label for="e-body">본문</label>' +
        '<textarea id="e-body" placeholder="강의 노트 · 열린 사람에게만 보여요">' + esc(f.body) + "</textarea></div>" +

      '<details class="adv"' + (ED.access.length || ED.hide || ED.pin || f.basisDate ? " open" : "") + ">" +
        "<summary>접근 권한 · 기준일 · 표시</summary>" +

        '<div class="f"><label>누가 볼 수 있나</label><div class="checks" id="e-acc">' +
          '<button class="ck" data-g="all" aria-pressed="' + isAll + '">전체 공개</button>' +
          groups.map(function (g) {
            return '<button class="ck" data-g="' + esc(g) + '" aria-pressed="' + (ED.access.indexOf(g) >= 0) + '"' + (isAll ? " disabled" : "") + ">" + esc(g) + "</button>";
          }).join("") +
        "</div>" +
        '<p class="hint' + (ED.access.length ? "" : " bad") + '">' +
          (ED.access.length ? "고른 그룹 중 하나라도 가진 멤버에게 열려요." : "아무것도 고르지 않으면 잠깁니다. 크레딧·이용권으로만 열려요.") +
          "<br>member = 지금 멤버십이 살아 있는 모든 회원 (해지하면 자동으로 잠겨요)</p></div>" +

        '<div class="f"><label for="e-basis">기준일</label>' +
          '<input id="e-basis" value="' + esc(f.basisDate) + '" placeholder="2026-08" />' +
          '<p class="hint">세법·규제 기준 시점이에요. 3개월 지나면 안내, 6개월 넘으면 경고가 자동으로 붙어요. 자동 갱신은 하지 않아요.</p></div>' +

        '<div class="f"><div class="checks">' +
          '<button class="ck" id="e-pin" aria-pressed="' + ED.pin + '">맨 위에 고정</button>' +
          '<button class="ck" id="e-hide" aria-pressed="' + ED.hide + '">제목까지 숨기기</button>' +
        "</div>" +
        '<p class="hint">숨기면 권한 없는 사람의 목록에서 아예 사라져요. 개인 피드백 영상용이에요.</p></div>' +
      "</details>" +

      '<button class="btn primary block" id="e-save" style="margin-top:18px">저장</button>' +
      '<button class="alt" id="e-cancel">취소</button>' +
      (ED.id ? '<div style="text-align:center"><button class="danger" id="e-del">이 강의 삭제</button></div>' : "") +
    "</div>";
  document.body.appendChild(v);

  /* 분류 직접 입력 */
  var sel = document.getElementById("e-cat");
  sel.onchange = function () {
    if (sel.value !== "__new") { grabEditor(); return; }
    var t = prompt("새 분류 이름");
    grabEditor();
    ED.f.cat = t ? t.trim() : (cats[0] || "기타");
    renderEditor();
  };

  /* 비메오 주소를 치는 동안 읽히는지 바로 보여준다 — 저장하고 재생에서 알면 늦다 */
  var vi = document.getElementById("e-vimeo"), vh = document.getElementById("e-vh");
  function checkVimeo() {
    var s = vi.value.trim();
    if (!s) { vh.className = "hint"; vh.textContent = "주소를 어떤 형태로 붙여넣어도 알아서 읽어요."; return; }
    var m = s.match(/vimeo\.com\/(?:video\/)?(\d+)/) || (/^\d+$/.test(s) ? [null, s] : null);
    if (m) { vh.className = "hint good"; vh.textContent = "영상 번호 " + m[1] + " 로 읽었어요"; }
    else { vh.className = "hint bad"; vh.textContent = "이 주소는 읽지 못했어요. vimeo.com 주소인지 확인해주세요."; }
  }
  vi.oninput = checkVimeo;
  if (vi.value) checkVimeo();

  /* 접근 권한 토글 */
  Array.prototype.forEach.call(v.querySelectorAll("#e-acc .ck"), function (b) {
    b.onclick = function () {
      grabEditor();
      var g = b.dataset.g, i = ED.access.indexOf(g);
      if (g === "all") ED.access = i >= 0 ? [] : ["all"];
      else if (i >= 0) ED.access.splice(i, 1);
      else ED.access.push(g);
      renderEditor();
    };
  });
  document.getElementById("e-pin").onclick = function () { grabEditor(); ED.pin = !ED.pin; renderEditor(); };
  document.getElementById("e-hide").onclick = function () { grabEditor(); ED.hide = !ED.hide; renderEditor(); };

  document.getElementById("e-cancel").onclick = close;
  v.onclick = function (e) { if (e.target === v) close(); };
  document.getElementById("e-save").onclick = save;

  var del = document.getElementById("e-del");
  if (del) del.onclick = function () {
    if (!confirm("정말 지울까요? 되돌릴 수 없어요.\n\n" + f.title)) return;
    api("archiveDelete", { adminKey: ST.pin, id: ED.id }).then(function () {
      ED = null; v.remove(); toast("지웠어요"); load(false);
    }).catch(function (e) { toast(e.message); });
  };

  function close() { ED = null; v.remove(); }

  function save() {
    grabEditor();
    var btn = document.getElementById("e-save");
    if (!ED.f.title.trim()) { toast("제목을 입력해주세요"); return; }
    var lec = {
      id: ED.id || 0,
      title: ED.f.title.trim(),
      cat: ED.f.cat === "__new" || !ED.f.cat ? "기타" : ED.f.cat,
      date: ED.f.date.trim(),
      vimeo: ED.f.vimeo.trim(),
      summary: ED.f.summary.trim(),
      body: ED.f.body,
      basisDate: ED.f.basisDate.trim(),
      access: ED.access,
      hide: ED.hide,
      pin: ED.pin,
    };
    btn.disabled = true; btn.textContent = "저장 중…";
    api("archiveSave", { adminKey: ST.pin, lecture: lec }).then(function (r) {
      ED = null; v.remove();
      toast(!r.vimeoOk ? "저장했지만 영상 주소를 읽지 못했어요"
           : r.locked ? "저장했어요 · 접근 권한이 비어 있어 잠긴 상태예요"
           : "저장했어요");
      load(false);
    }).catch(function (e) {
      btn.disabled = false; btn.textContent = "저장";
      toast(e.message);
    });
  }
}

/* 멤버 탭 핸들러 — 화면을 다시 그리기 전에 입력값을 붙잡아 둔다 */
function grabMember() {
  var M = ST.mem, v;
  function val(id) { var e = document.getElementById(id); return e ? e.value : null; }
  v = val("m-g"); if (v !== null) M.group = v.trim();
  v = val("m-u"); if (v !== null) M.until = v.trim();
  v = val("m-t"); if (v !== null) M.tickets = Number(v) || 0;
  v = val("m-list"); if (v !== null) M.text = v;
  v = val("m-q"); if (v !== null) M.q = v.trim();
  v = val("m-bn"); if (v !== null) M.bulkN = Number(v) || 0;
  v = val("m-br"); if (v !== null) M.bulkR = v.trim();
}

function bindMember() {
  var M = ST.mem;
  if (!ST.data || !ST.data.staff || ST.atab !== "mem") return;

  /* 일괄 지급 대상 목록은 한 번만 불러온다 */
  if (!M.groups) {
    M.groups = [];
    api("groupCounts", { adminKey: ST.pin }).then(function (g) {
      M.groups = g || []; if (ST.atab === "mem") { grabMember(); render(); }
    }).catch(function () {});
  }

  var chk = document.getElementById("m-check");
  if (chk) chk.onclick = function () {
    grabMember();
    if (!M.text || !M.text.trim()) { toast("명단을 붙여넣어 주세요"); return; }
    chk.disabled = true; chk.textContent = "확인 중…";
    api("rosterPreview", { adminKey: ST.pin, text: M.text, group: M.group, tickets: M.tickets })
      .then(function (r) { M.plan = r; render(); })
      .catch(function (e) { chk.disabled = false; chk.textContent = "확인하기"; toast(e.message); });
  };

  var back = document.getElementById("m-back");
  if (back) back.onclick = function () { M.plan = null; render(); };

  var com = document.getElementById("m-commit");
  if (com) com.onclick = function () {
    com.disabled = true; com.textContent = "등록 중…";
    api("rosterCommit", { adminKey: ST.pin, text: M.text, group: M.group, tickets: M.tickets, until: M.until })
      .then(function (r) {
        M.plan = null; M.text = ""; M.groups = null; M.found = null;
        toast(r.done.length + "명 등록했어요");
        load(false);
      })
      .catch(function (e) { com.disabled = false; com.textContent = "다시 시도"; toast(e.message); });
  };

  var fnd = document.getElementById("m-find"), q = document.getElementById("m-q");
  function doFind() {
    grabMember();
    if (!M.q) { toast("이름이나 뒷 4자리를 넣어주세요"); return; }
    api("memberFind", { adminKey: ST.pin, q: M.q })
      .then(function (r) { M.found = r.list; render(); })
      .catch(function (e) { toast(e.message); });
  }
  if (fnd) fnd.onclick = doFind;
  if (q) q.onkeydown = function (e) { if (e.key === "Enter") doFind(); };

  Array.prototype.forEach.call(document.querySelectorAll(".mg-go"), function (b) {
    b.onclick = function () {
      var id = Number(b.dataset.id);
      var n = Number((document.querySelector('.mg-n[data-id="' + id + '"]') || {}).value) || 0;
      var r = (document.querySelector('.mg-r[data-id="' + id + '"]') || {}).value || "";
      if (!n) { toast("장수를 넣어주세요"); return; }
      b.disabled = true;
      api("ticketGrant", { adminKey: ST.pin, id: id, n: n, reason: r })
        .then(function (res) { toast("이용권 " + n + "장 지급 · 남은 " + res.tickets + "장"); doFind(); })
        .catch(function (e) { b.disabled = false; toast(e.message); });
    };
  });

  Array.prototype.forEach.call(document.querySelectorAll(".mg-drop"), function (b) {
    b.onclick = function () {
      var id = Number(b.dataset.id);
      if (!confirm("이 분의 멤버십(member)을 뺄까요?\n\n커뮤니티·원픽 지도·경매통계가 닫힙니다.\n크레딧·인증글·랭킹은 그대로 남아요.")) return;
      api("memberDropMembership", { adminKey: ST.pin, id: id })
        .then(function () { toast("멤버십을 뺐어요"); doFind(); })
        .catch(function (e) { toast(e.message); });
    };
  });

  Array.prototype.forEach.call(document.querySelectorAll("#m-bg .ck"), function (b) {
    b.onclick = function () { grabMember(); M.bulk = (M.bulk === b.dataset.g ? "" : b.dataset.g); render(); };
  });
  ["m-bn", "m-br"].forEach(function (id) {
    var e = document.getElementById(id);
    if (e) e.onchange = function () { grabMember(); render(); };
  });

  var bulk = document.getElementById("m-bulk");
  if (bulk) bulk.onclick = function () {
    grabMember();
    if (!confirm(bulkLabel(M.groups, M.bulk, M.bulkN) + "\n\n되돌리려면 한 사람씩 빼야 합니다. 진행할까요?")) return;
    bulk.disabled = true; bulk.textContent = "지급 중…";
    api("ticketGrantBulk", { adminKey: ST.pin, group: M.bulk, n: M.bulkN, reason: M.bulkR })
      .then(function (r) {
        toast(r.people + "명에게 " + r.each + "장씩 · 총 " + r.total + "장 지급했어요");
        M.groups = null; M.found = null; load(false);
      })
      .catch(function (e) { bulk.disabled = false; toast(e.message); });
  };
}

/* ═══════════════════════════════════════════════════════════════
   불러오기
   ═══════════════════════════════════════════════════════════════ */
function load(showSkeleton) {
  if (showSkeleton && !ST.data) render();
  return api("lecList", { token: ST.guest ? undefined : (ST.token || undefined), adminKey: ST.pin || undefined })
    .then(function (d) {
      ST.data = d;
      ST.offset = (d.nowMs || Date.now()) - Date.now();
      ST.guest = !!d.guest;
      if (!d.staff) lsSet(d.guest ? LEC_KEY + "_g" : LEC_KEY, { t: Date.now(), d: d });
      render();
    })
    .catch(function (e) {
      var msg = String(e.message || "");
      /* 토큰 만료·무효 → 로그인 화면으로. 그 외 오류는 캐시 화면을 유지한다 */
      if (/토큰|로그인|세션|인증/.test(msg) || !ST.data) {
        lsDel(SESS_KEY);
        renderGate(ST.data ? null : msg, ST.name);
      } else {
        toast(msg);
      }
    });
}

/* 남은 시간 표시를 1분마다 되그린다 (열려 있는 카드는 건드리지 않음) */
setInterval(function () {
  if (!ST.data || ST.pending) return;
  var stale = ST.data.lectures.some(function (l) {
    return l.byPass && l.passExpiresMs && l.passExpiresMs <= now() && l.open;
  });
  if (stale) { load(false); return; }
  Array.prototype.forEach.call(document.querySelectorAll(".tag.time"), function (t) {
    var c = t.closest(".card"); if (!c) return;
    var id = Number(c.querySelector(".head").dataset.id);
    var l = ST.data.lectures.filter(function (x) { return x.id === id; })[0];
    if (l && l.passExpiresMs) t.textContent = remain(l.passExpiresMs) || "곧 만료";
  });
}, 60000);

/* ═══════════════════════════════════════════════════════════════
   시작
   ═══════════════════════════════════════════════════════════════ */
(function boot() {
  try { ST.pin = sessionStorage.getItem("ht_pin") || null; } catch (e) {}

  var s = lsGet(SESS_KEY);
  if (s && s.token && Date.now() - (s.t || 0) < SESS_DAYS * 86400000) {
    ST.token = s.token; ST.name = s.name || "";
  } else if (s) {
    lsDel(SESS_KEY);
  }

  if (!ST.token && !ST.pin) { renderGate(null, (s && s.name) || ""); return; }

  /* 캐시가 있으면 먼저 그린다 — 목록만이라 틀려도 위험하지 않고,
     실제 재생은 서버가 lecOpen 에서 다시 판정한다.
     v59: 6시간은 너무 길었다. 자격을 바꿔도 반나절 옛 화면이 보인다. 1시간으로 줄였다. */
  var c = lsGet(LEC_KEY);
  if (c && c.d && Date.now() - (c.t || 0) < 3600000) {
    ST.data = c.d; ST.offset = 0; render();
  }
  load(true);
})();
</script>
</body>
</html>
